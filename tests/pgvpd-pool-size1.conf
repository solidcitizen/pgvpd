# Single-connection pool, for the #14 same-slot drain-pin probe
# (tests/same-slot-probe.sh). pool_size = 1 forces the next client to reuse the
# exact connection the previous client abandoned, so the drain-pin — the time a
# slot is held while checkin drains an abandoned in-flight query — is directly
# measurable. pool_checkout_timeout is generous so the probe waits out the pin
# instead of erroring.
port = 16432
upstream_host = 127.0.0.1
upstream_port = 15432
context_variables = app.current_tenant_id
superuser_bypass = postgres
log_level = info
pool_mode = session
pool_size = 1
pool_password = testpass
upstream_password = testpass
pool_checkout_timeout = 12
