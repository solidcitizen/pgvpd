# Slot-leak regression config (issue #20). Upstream points at the black-hole
# server (tests/blackhole.mjs) on 15999, which accepts but never responds, so
# every create_connection outlives the short handshake timeout and its checkout
# is cancelled. A correct pool releases each reserved slot; a leaky one pins
# total at pool_size. handshake_timeout (4s) is kept above pool_checkout_timeout
# (1s) so a wedged pool reports "all connections in use" (the inner checkout
# timeout) rather than the outer handshake timeout — deterministic wedge check.
port = 16432
listen_host = 127.0.0.1
upstream_host = 127.0.0.1
upstream_port = 15999
context_variables = app.current_tenant_id
superuser_bypass = postgres
log_level = info
pool_mode = session
pool_size = 3
pool_password = testpass
upstream_password = testpass
handshake_timeout = 4
pool_checkout_timeout = 1
admin_port = 16433
