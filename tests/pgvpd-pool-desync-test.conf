# Pool mode config for the hand-off regression test (7P.4, issue #11).
# pool_size is deliberately >= the harness's concurrency: when checkouts queue
# on a full pool, a stale response and the fresh one tend to land in a single
# read and the old bug hid itself. Immediate hand-offs expose it reliably.
port = 16432
upstream_host = 127.0.0.1
upstream_port = 15432
context_variables = app.current_tenant_id
superuser_bypass = postgres
log_level = info
pool_mode = session
pool_size = 8
pool_password = testpass
upstream_password = testpass
